[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "parking-guard"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "paho-mqtt>=2.0",
  "pyyaml>=6.0",
  "requests>=2.31",
]

[project.scripts]
parking-guard = "parking_guard.__main__:main"
parking-guard-sync = "parking_guard.sync:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["parking_guard*"]
